# Load balancer configuration. Only backends is required; every other
# setting falls back to the default shown in its comment.

# Address to listen on. Default ":8000".
listen: ":8000"

# How requests are spread: round-robin, least-connections,
# weighted-round-robin, or weighted-least-connections. Default round-robin.
algorithm: round-robin

# The servers to balance across. scripts/run-backends.sh starts these.
# Each entry is a URL, or an object with a url and a weight. Under
# weighted-round-robin, a backend with weight 3 gets three times the
# traffic of one with weight 1; under weighted-least-connections it counts
# as equally busy at three times the requests in progress. Other algorithms
# ignore weights.
# Default weight 1. For example:
#   - url: http://127.0.0.1:8082
#     weight: 3
backends:
  - http://127.0.0.1:8080
  - http://127.0.0.1:8081
  - http://127.0.0.1:8082

# Path requested on every backend by health checks. A backend that answers
# 200 is healthy. Default /health.
health_path: /health

# How often each backend's health path is checked. Default 5s.
health_check_interval: 5s

# How long one backend has to start answering before the attempt fails
# and, for GET/HEAD/OPTIONS, is retried on another backend. Default 5s.
attempt_timeout: 5s

# Total time a request may take, across all retries. Default 10s.
request_timeout: 10s

# Failures in a row that mark a backend down. Connection errors mark it
# down immediately. Default 3.
max_failures: 3

# Largest request body accepted. Larger requests get a 413 and never reach
# a backend. A plain number of bytes, or a size with KB, MB or GB (powers of
# 1024, as in nginx's client_max_body_size). Default 1MB.
max_body_size: 1MB

# Log one line per request to stdout: method, path, status, size, duration,
# client and backend. Errors and state changes go to stderr either way.
# Default true.
access_log: true

# Address of the admin server, which serves GET /stats (a JSON snapshot of
# every backend). It shows internal addresses, so keep it on 127.0.0.1,
# where only this machine can reach it; ":9000" would accept connections
# from anywhere. Leave it out to turn the admin server off.
admin_listen: "127.0.0.1:9000"
