services:
  loadbalancer:
    build: .
    image: loadbalancer
    volumes:
      - ./docker/config.yaml:/etc/loadbalancer/config.yaml:ro
      - certs:/etc/loadbalancer/certs:ro
    ports:
      - "8000:8000"
      - "127.0.0.1:9000:9000"
    depends_on:
      certs:
        condition: service_completed_successfully
      backend1:
        condition: service_started
      backend2:
        condition: service_started
      backend3:
        condition: service_started
    # Above the drain on shutdown, request_timeout + 5s, so docker doesn't
    # kill requests still finishing.
    stop_grace_period: 20s

  # Makes a self-signed certificate for localhost on the first run, kept in
  # the certs volume; docker compose down -v throws it away. The Go image is
  # the one the load balancer is built with, so nothing more is pulled.
  certs:
    image: golang:1.27
    volumes:
      - certs:/certs
    working_dir: /certs
    command:
      - sh
      - -c
      - |
        [ -f cert.pem ] && exit 0
        go run /usr/local/go/src/crypto/tls/generate_cert.go --host localhost,127.0.0.1
        # The key is only readable by its owner: the distroless nonroot user.
        chown 65532:65532 cert.pem key.pem

  prometheus:
    image: prom/prometheus:v3.15.0
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on: [loadbalancer]

  # Dashboards of the Prometheus metrics, open to anyone who can reach it as
  # a viewer, which is why it's published on the host's loopback only. Log
  # in as admin/admin to edit.
  grafana:
    image: grafana/grafana:13.2.3
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/loadbalancer.json
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]

  backend1:
    image: loadbalancer
    pull_policy: never
    # Each answers with a different typical latency and tail (see -jitter),
    # so the latency dashboard tells them apart.
    command: ["/fakebackend", "-port", "8080", "-name", "backend1", "-delay", "2ms", "-jitter", "3ms"]

  backend2:
    image: loadbalancer
    pull_policy: never
    command: ["/fakebackend", "-port", "8080", "-name", "backend2", "-delay", "5ms", "-jitter", "15ms"]

  backend3:
    image: loadbalancer
    pull_policy: never
    command: ["/fakebackend", "-port", "8080", "-name", "backend3", "-delay", "1ms", "-jitter", "1ms"]

volumes:
  certs:
