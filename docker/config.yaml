# Config for docker compose. See ../config.yaml for every setting.

listen: ":8000"

# Compose service names, which resolve to each container. 127.0.0.1 would
# be the load balancer's own container.
backends:
  - http://backend1:8080
  - http://backend2:8080
  - http://backend3:8080

# Made by the certs service in docker-compose.yml.
tls_cert: /etc/loadbalancer/certs/cert.pem
tls_key: /etc/loadbalancer/certs/key.pem

# All interfaces inside the container, so the published port reaches it.
# docker-compose.yml publishes it on the host's loopback only.
admin_listen: ":9000"
